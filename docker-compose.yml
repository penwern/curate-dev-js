services:
  curate-js:
    container_name: curate-js
    build: .
    ports:
      - "6900:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.curate-js.rule=Host(`curate-js.localhost`)"
      - "traefik.http.services.curate-js.loadbalancer.server.port=8080"